
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLAME DRAGON - Orbit</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at center, #21100f 0%, #09090d 65%, #050507 100%);
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.container {
  width: 100%;
  max-width: 1000px;
  padding: 15px;
  text-align: center;
}

h1 {
  color: #ff4b32;
  font-size: clamp(22px, 4vw, 34px);
  text-shadow: 0 0 18px #ff321b66;
  margin-bottom: 8px;
}

.subtitle {
  color: #b9b9c5;
  margin-bottom: 15px;
  font-size: 14px;
}

.orbit-stage {
  position: relative;
  width: 100%;
  height: min(70vh, 590px);
  min-height: 400px;
  overflow: hidden;
  isolation: isolate;
}

/* المسار الدائري */
.orbit-path {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(76%, 470px);
  aspect-ratio: 1;
  border: 1px solid #ff57334d;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 25px #ff321b0d;
  pointer-events: none;
}

/* توهج إضافي للمسار */
.orbit-path::before {
  content: "";
  position: absolute;
  inset: -8px;
  border: 1px dashed #ff573326;
  border-radius: 50%;
}

/* اللوجو في المنتصف */
.logo {
  position: absolute;
  z-index: 2;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 125px;
  height: 125px;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(145deg, #27110f, #100d12);
  border: 2px solid #ff5733;
  box-shadow:
    0 0 20px #ff321b50,
    inset 0 0 20px #ff321b18;
}

.logo-icon {
  font-size: 42px;
  line-height: 1.1;
}

.logo-name {
  color: #ff6247;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1px;
  margin-top: 7px;
  direction: ltr;
}

/*
  العنصر الخارجي يتحرك على المسار فقط.
  لا نضيف دورانًا إلى المربع نفسه.
*/
.orbit-item {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 155px;
  min-height: 110px;
  transform: translate(-50%, -50%);
  will-change: left, top;
  z-index: 3;
}

/* المربع ومحتواه يظلان مستقيمين */
.orbit-card {
  width: 100%;
  min-height: 110px;
  padding: 16px 10px;
  border: 1px solid #ff57336b;
  border-radius: 15px;
  background: linear-gradient(145deg, #211416f5, #100e13f5);
  box-shadow: 0 8px 25px #0008, 0 0 15px #ff321b0b;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition:
    border-color 0.2s ease,
    box-shadow 0.2s ease,
    background 0.2s ease;
}

.orbit-card:hover {
  border-color: #ff6247;
  background: linear-gradient(145deg, #351718, #171017);
  box-shadow: 0 0 25px #ff321b35;
}

.card-icon {
  font-size: 27px;
  margin-bottom: 8px;
}

.card-title {
  font-size: 15px;
  font-weight: bold;
  color: #ff674d;
  direction: ltr;
}

.card-description {
  margin-top: 6px;
  color: #c7c3cc;
  font-size: 12px;
}

/* حركة مستمرة للمربعات */
@media (prefers-reduced-motion: reduce) {
  .orbit-item {
    will-change: auto;
  }
}

@media (max-width: 520px) {
  .orbit-stage {
    height: 450px;
    min-height: 450px;
  }

  .orbit-item {
    width: 112px;
    min-height: 94px;
  }

  .orbit-card {
    min-height: 94px;
    padding: 10px 5px;
    border-radius: 12px;
  }

  .card-icon {
    font-size: 22px;
    margin-bottom: 5px;
  }

  .card-title {
    font-size: 12px;
  }

  .card-description {
    font-size: 10px;
  }

  .logo {
    width: 100px;
    height: 100px;
  }

  .logo-icon {
    font-size: 33px;
  }

  .logo-name {
    font-size: 10px;
  }

  .orbit-path {
    width: 72%;
  }
}
</style>
</head>

<body>
<main class="container">
  <h1>FLAME DRAGON HUB</h1>
  <p class="subtitle">Your EvoWorld hub</p>

  <section class="orbit-stage" id="orbitStage">
    <div class="orbit-path"></div>

    <div class="logo">
      <div class="logo-icon">🔥</div>
      <div class="logo-name">FLAME DRAGON</div>
    </div>

    <div class="orbit-item">
      <div class="orbit-card">
        <div class="card-icon">🦇</div>
        <div class="card-title">Evolutions</div>
        <div class="card-description">Explore every stage</div>
      </div>
    </div>

    <div class="orbit-item">
      <div class="orbit-card">
        <div class="card-icon">💀</div>
        <div class="card-title">Skins Library</div>
        <div class="card-description">Discover your skins</div>
      </div>
    </div>

    <div class="orbit-item">
      <div class="orbit-card">
        <div class="card-icon">⚙️</div>
        <div class="card-title">Settings</div>
        <div class="card-description">Customize your hub</div>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  const stage = document.getElementById("orbitStage");
  const items = [...stage.querySelectorAll(".orbit-item")];

  const speed = 0.00022;
  let angle = -Math.PI / 2;
  let lastTime = 0;
  let radiusX = 180;
  let radiusY = 180;
  let centerX = 0;
  let centerY = 0;
  let animationId;

  function measure() {
    const rect = stage.getBoundingClientRect();

    centerX = rect.width / 2;
    centerY = rect.height / 2;

    const cardWidth = items[0].offsetWidth;
    const cardHeight = items[0].offsetHeight;

    radiusX = Math.max(
      0,
      Math.min(300, (rect.width - cardWidth) / 2 - 10)
    );

    radiusY = Math.max(
      0,
      Math.min(245, (rect.height - cardHeight) / 2 - 10)
    );
  }

  function render() {
    items.forEach((item, index) => {
      const a = angle + index * (Math.PI * 2 / items.length);

      const x = centerX + Math.cos(a) * radiusX;
      const y = centerY + Math.sin(a) * radiusY;

      /*
        مهم:
        نغير مكان العنصر الخارجي فقط.
        لا نستخدم rotate() للمربع أو النص.
      */
      item.style.left = `${x}px`;
      item.style.top = `${y}px`;
    });
  }

  function animate(time) {
    if (!lastTime) lastTime = time;

    const delta = Math.min(time - lastTime, 40);
    lastTime = time;

    angle += speed * delta;

    if (angle > Math.PI * 2) {
      angle -= Math.PI * 2;
    }

    render();
    animationId = requestAnimationFrame(animate);
  }

  measure();
  render();
  animationId = requestAnimationFrame(animate);

  if ("ResizeObserver" in window) {
    new ResizeObserver(() => {
      measure();
      render();
    }).observe(stage);
  } else {
    window.addEventListener("resize", () => {
      measure();
      render();
    });
  }

  window.addEventListener("pagehide", () => {
    cancelAnimationFrame(animationId);
  });
})();
</script>
</body>
</html>
