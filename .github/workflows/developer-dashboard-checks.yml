name: Developer dashboard checks

on:
  push:
    branches:
      - developer-dashboard-foundation
      - secure-developer-dashboard-email-admin
      - owner-only-dashboard-uid-nav
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax-and-wiring:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in auth.js firebase-data.js developer.js; do
            test -f "$file"
            node --input-type=module --check < "$file"
            echo "Syntax OK: $file"
          done

      - name: Check dashboard wiring and admin protection
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="devGate"' developer.html
          grep -q 'id="devContent"' developer.html
          grep -q 'src="developer.js"' developer.html
          grep -q 'mPYAzTPWOkZTpzB0caXXXzNHDdg2' developer.js
          grep -q 'emailVerified' developer.js
          grep -q 'mPYAzTPWOkZTpzB0caXXXzNHDdg2' firestore.rules
          grep -q 'email_verified' firestore.rules
          grep -q 'recordAuthEvent' auth.js
          for page in index.html evolutions.html skins.html favorites.html settings.html account.html profile.html about.html guide.html skin-studio.html; do
            grep -q 'href="developer.html"' "$page"
          done
          grep -q 'developer-link' style.css
          echo "Dashboard wiring and admin protection checks passed."
