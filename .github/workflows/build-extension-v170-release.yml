name: Build FLAME DRAGON HUB 1.7.0 download

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify extension version and build ZIP
        shell: bash
        run: |
          test "$(node -p "require('./extension/manifest.json').version")" = "1.7.0"
          test "$(node -p "require('./extension/manifest.json').name")" = "FLAME DRAGON HUB 1.7.0"
          cd extension
          zip -qr ../FLAME_DRAGON_HUB_1.7.0.zip .

      - name: Publish the named ZIP release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "1.7.0"
          name: "FLAME DRAGON HUB 1.7.0"
          body: "FLAME DRAGON HUB 1.7.0 Chrome extension package."
          files: FLAME_DRAGON_HUB_1.7.0.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
