<meta name="theme-color" content="#100b10">
<title>Evolutions | FLAME DRAGON HUB</title>
  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --bg: #100b10;
      --panel: rgba(29, 20, 31, .96);
      --red: #ff4657;
      --red-light: #ff929b;
      --text: #fff4f6;
      --muted: #b8aab8;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 24px;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 35%, rgba(130, 22, 45, .20), transparent 45%),
        var(--bg);
      background-attachment: fixed;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    /* Themes picked in Settings. Gradients are copied from index.html so a
       theme selected there looks identical here. body[data-theme] is more
       specific than the base rule above, so it wins; "ember" (the default)
       intentionally keeps the crimson shell. */
    body[data-theme="night"] {
      background:
        radial-gradient(circle at 50% 45%,
          rgba(80,90,120,.25) 0%, rgba(30,35,55,.12) 25%, transparent 50%),
        linear-gradient(135deg, #05070d 0%, #101522 45%, #070910 100%);
      background-attachment: fixed, fixed;
    }

    body[data-theme="void"] {
      background:
        radial-gradient(circle at 50% 45%,
          rgba(150,60,255,.28) 0%, rgba(80,30,160,.12) 25%, transparent 50%),
        linear-gradient(135deg, #0c0414 0%, #210b35 45%, #08030d 100%);
      background-attachment: fixed, fixed;
    }

    body[data-theme="frost"] {
      background:
        radial-gradient(circle at 50% 45%,
          rgba(100,210,255,.25) 0%, rgba(50,130,190,.10) 25%, transparent 50%),
        linear-gradient(135deg, #041016 0%, #0b2530 45%, #03090d 100%);
      background-attachment: fixed, fixed;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* style.css paints two drifting orange glows behind the page. index.html
       has none of that, so switch them off to keep the shell identical. */
    body::before,
    body::after {
      content: none;
      display: none;
      background: none;
      box-shadow: none;
      animation: none;
      filter: none;
    }

    /* NAVBAR */
    .navbar {
      position: relative;
      z-index: 100;
      width: min(1150px, 92%);
      min-height: 76px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .brand img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    .brand span { color: var(--red); }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 7px;
    }

    .nav-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 13px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--muted);
      font-size: 13px;
      transition: .25s ease;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: #fff;
      background: rgba(255,70,87,.12);
      border-color: rgba(255,70,87,.38);
      transform: translateY(-2px);
      outline: none;
    }

    .nav-links a.active {
      color: #fff;
      background: rgba(255,70,87,.15);
      border-color: rgba(255,70,87,.42);
      box-shadow: 0 0 18px rgba(255,70,87,.10);
    }

    /* PAGE */
    .page {
      width: min(1150px, 92%);
      margin: 0 auto;
      padding-bottom: 60px;
    }

    .hero {
      padding: 18px 0 12px;
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      color: var(--red-light);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .hero-title {
      margin: 8px 0 0;
      font-size: clamp(26px, 4vw, 42px);
      font-weight: 900;
      line-height: 1.2;
    }
