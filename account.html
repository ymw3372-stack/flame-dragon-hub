<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account | FLAME DRAGON HUB</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .account-page{max-width:1040px;margin:38px auto;padding:18px}
    .account-layout{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:20px;align-items:start}
    .account-profile-card{padding:26px;color:#f8fafc;background:linear-gradient(145deg,#171b27,#10121b);border:1px solid rgba(255,138,36,.42);border-radius:24px;box-shadow:0 14px 42px rgba(0,0,0,.25);text-align:center}
    .account-profile-card h2{margin:0 0 8px;color:#ffb16e}
    .account-profile-card .profile-avatar{width:112px;height:112px;margin:18px auto 12px;border-radius:50%;border:2px solid #ff963d;display:flex;align-items:center;justify-content:center;font-size:54px;background-color:rgba(255,150,61,.12);background-position:center;background-size:cover;background-repeat:no-repeat;overflow:hidden}
    .account-profile-card .avatar-options{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:7px;margin:14px 0}
    .account-profile-card .avatar-options button{min-width:40px;min-height:38px;border:1px solid rgba(255,150,61,.4);border-radius:10px;background:rgba(255,150,61,.1);color:white;cursor:pointer;font-size:20px}
    .account-profile-card .upload-avatar{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 12px;border:1px solid rgba(255,150,61,.45);border-radius:10px;background:rgba(255,150,61,.12);color:#ffcf9e;cursor:pointer;font-size:13px}
    .account-profile-card .upload-avatar input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
    .account-profile-card .profile-info p,.account-profile-card .profile-hint{color:#b8becb;font-size:13px}
    .account-profile-card .profile-button{margin-top:8px;padding:10px 15px;border:1px solid rgba(255,150,61,.4);border-radius:11px;color:#ffcf9e;background:rgba(255,150,61,.1);cursor:pointer}
    .account-profile-stats{margin-top:20px;padding-top:15px;border-top:1px solid rgba(255,255,255,.1);color:#cbd5e1}
    .account-profile-stats strong{display:block;color:#ffb16e;font-size:24px}
    .account-back{display:inline-block;margin:0 0 18px;padding:10px 16px;color:#ffb16e;background:rgba(255,138,36,.09);border:1px solid rgba(255,138,36,.35);border-radius:14px;text-decoration:none}
    @media(max-width:760px){.account-layout{grid-template-columns:1fr}.account-page{margin:18px auto;padding:14px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="assets/logo.png" alt="FLAME DRAGON HUB"><span>FLAME DRAGON HUB</span></div>
    <nav class="navigation" aria-label="Main navigation">
      <a href="index.html">Home</a><a href="evolutions.html">Evolutions</a><a href="skins.html">Skins</a><a href="settings.html">Settings</a><a href="account.html" class="active" aria-current="page">👤 Account</a>
    </nav>
  </header>
  <main class="account-page">
    <a class="account-back" href="settings.html">← Back to Settings</a>
    <div class="account-layout">
      <section class="account-profile-card" aria-labelledby="profileHeading">
        <h2 id="profileHeading">🎮 Account Profile</h2>
        <div class="profile-avatar" id="profileAvatar">🐉</div>
        <div class="avatar-options" id="avatarOptions" aria-label="Choose profile avatar">
          <button type="button" data-avatar="🐉" aria-label="Dragon">🐉</button><button type="button" data-avatar="🔥" aria-label="Fire">🔥</button><button type="button" data-avatar="👹" aria-label="Ogre">👹</button><button type="button" data-avatar="⚡" aria-label="Lightning">⚡</button><button type="button" data-avatar="🌑" aria-label="Moon">🌑</button><button type="button" data-avatar="💀" aria-label="Skull">💀</button>
          <label class="upload-avatar" for="avatarUpload">📷 Choose Photo</label>
          <input type="file" id="avatarUpload" accept="image/png,image/jpeg,image/webp,image/gif">
        </div>
        <div class="profile-info"><h2 id="profileName">FLAME DRAGON</h2><p>EvoWorld Explorer</p><button id="editProfile" class="profile-button" type="button">✏️ Edit Player Name</button></div>
        <div class="account-profile-stats"><strong id="favoriteCount">0</strong><span>Favorites</span></div>
        <p class="profile-hint">Your profile photo and player name are saved on this browser.</p>
      </section>
      <section id="account" class="account-card" aria-labelledby="accountHeading">
        <h1 id="accountHeading">🐉 Your Dragon Account</h1>
        <p class="account-subtitle">Sign in or create an account to join the hub.</p>
        <p id="authStatus" aria-live="polite">Checking account...</p>
        <form id="authForm">
          <label for="authEmail">Email address</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
          <label for="authPassword">Password</label><input id="authPassword" type="password" minlength="6" autocomplete="current-password" placeholder="At least 6 characters" required>
          <button class="account-primary" type="submit">Sign in</button><button id="createAccount" class="account-secondary" type="button">Create account</button>
        </form>
        <button id="googleSignIn" class="account-google" type="button"><span>G</span> Continue with Google</button>
        <button id="resetPassword" class="account-forgot" type="button">Forgot password?</button>
        <button id="resendVerification" class="account-secondary" type="button" hidden>Resend verification email</button>
        <button id="refreshVerification" class="account-secondary" type="button" hidden>I've verified my email</button>
        <button id="signOut" class="account-secondary" type="button" hidden>Sign out</button>
      </section>
    </div>
  </main>
  <script src="profile.js"></script><script src="preferences.js"></script><script src="cursor-glow.js"></script><script type="module" src="auth.js"></script>
</body>
</html>
